<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Zupona — trusted online shop. Authentic beauty, fashion, accessories, baby care and toys with fast nationwide delivery and 30-day returns.">
<title>All Products — Zupona</title>
<link rel="stylesheet" href="css/zupona.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zupona">
</head>
<body data-page="shop">

<header id="hd"></header>

<main class="wrap">
  <div class="ph">
    <nav class="crumb"><a href="index.html">Home</a><span>/</span><span>All products</span></nav>
    <h1 id="shTitle">All products</h1>
    <p style="font-size:13px;color:var(--ink-3);margin-top:6px" id="echo"></p>
  </div>

  <div class="two">
    <aside class="fl" id="fl">
      <div class="pnl mb" style="display:flex;align-items:center;justify-content:space-between">
        <strong>Filters</strong>
        <button class="ico" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="pnl">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <h3 style="margin:0">Category</h3><button class="del" id="reset">Reset all</button>
        </div>
        <ul id="fCats"></ul>
      </div>
      <div class="pnl">
        <h3>Price (Tk)</h3>
        <div class="rng"><input id="pMin" type="number" min="0" placeholder="Min"><span>–</span><input id="pMax" type="number" min="0" placeholder="Max"></div>
        <button class="btn btn-line btn-sm btn-full" style="margin-top:14px" id="applyP">Apply</button>
      </div>
      <div class="pnl"><h3>Brand</h3><ul id="fBr" style="max-height:230px;overflow:auto"></ul></div>
      <div class="pnl"><h3>Rating</h3><ul id="fRt"></ul></div>
    </aside>

    <section>
      <div class="tb">
        <button class="btn btn-line btn-sm mb" data-open="filters">Filters</button>
        <button class="btn btn-line btn-sm mb" id="sortBtn">Sort</button>
        <span class="cnt" id="cnt"></span>
        <div style="display:flex;gap:8px;align-items:center;margin-left:auto">
          <label class="sr" for="sort">Sort by</label>
          <select id="sort" class="dt">
            <option value="pop">Most popular</option>
            <option value="new">Newest first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="rate">Top rated</option>
            <option value="off">Biggest discount</option>
          </select>
          <div class="vt dt" style="display:flex">
            <button data-view="grid" class="on" aria-label="Grid"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
            <button data-view="list" aria-label="List"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          </div>
        </div>
      </div>
      <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
      <div class="grid" id="grid"></div>
      <div class="none hide" id="none"><h3>No products matched</h3><p>Try removing a filter or searching for something else.</p></div>
      <div class="pg" id="pg"></div>
    </section>
  </div>
</main>

<div id="ft"></div>
<div id="xt"></div>
<script src="js/zupona.js"></script>
</body>
</html>
